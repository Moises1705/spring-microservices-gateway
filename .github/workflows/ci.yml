name: CI

on:
  push:
    branches: [main, cicd]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            test_args: ""
          - service: order-service
            test_args: "-Dtest=!*ApplicationTests -Dsurefire.failIfNoSpecifiedTests=false"
          - service: inventory-service
            test_args: "-Dtest=!*ApplicationTests -Dsurefire.failIfNoSpecifiedTests=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B test ${{ matrix.test_args }}

  build-and-scan:
    name: Build + Trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, order-service, inventory-service]
    env:
      IMAGE: reto-${{ matrix.service }}:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy - reporte completo (informativo)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE":/work \
            "$TRIVY_IMAGE" image \
            --format table \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output /work/trivy-${{ matrix.service }}.txt \
            "$IMAGE"

      - name: Trivy - SARIF
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE":/work \
            "$TRIVY_IMAGE" image \
            --format sarif \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output /work/trivy-${{ matrix.service }}.sarif \
            "$IMAGE"

      - name: Resumen en el job
        if: always()
        run: |
          {
            echo "## Trivy - ${{ matrix.service }}"
            echo '```'
            docker run --rm "$TRIVY_IMAGE" --version
            echo
            cat trivy-${{ matrix.service }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir SARIF a Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Subir reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.txt
            trivy-${{ matrix.service }}.sarif

      - name: Trivy - umbral (falla con CRITICAL/HIGH con fix disponible)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE"

  scan-repo:
    name: Trivy fs (dependencias y config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            "$TRIVY_IMAGE" fs \
            --skip-files "**/pom.xml" --scanners misconfig,secret \
            --format table \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --output /work/trivy-fs.txt \
            /work
      - name: Resumen en el job
        if: always()
        run: |
          {
            echo "## Trivy fs"
            echo '```'
            cat trivy-fs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs
          path: trivy-fs.txt