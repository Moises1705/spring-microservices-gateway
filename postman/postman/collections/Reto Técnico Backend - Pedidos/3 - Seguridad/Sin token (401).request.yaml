$kind: http-request
url: "{{gatewayUrl}}/api/v1/products"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 TOKEN_INVALID_OR_EXPIRED', () => {
        pm.response.to.have.status(401);
        const json = pm.response.json();
        pm.expect(json.code).to.eql('TOKEN_INVALID_OR_EXPIRED');
        pm.expect(json.traceId).to.be.a('string');
      });
    language: text/javascript
order: 1000
