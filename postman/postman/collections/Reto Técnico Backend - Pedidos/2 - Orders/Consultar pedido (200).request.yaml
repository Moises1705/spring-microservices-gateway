$kind: http-request
url: "{{gatewayUrl}}/api/v1/orders/{{orderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Es el pedido creado', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('orderId')));
    language: text/javascript
order: 2000
