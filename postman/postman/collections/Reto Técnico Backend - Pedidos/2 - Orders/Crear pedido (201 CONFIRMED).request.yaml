$kind: http-request
url: "{{gatewayUrl}}/api/v1/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": "c-postman",
      "items": [
        { "productId": "{{productId}}", "quantity": 2 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set('orderId', json.id);
      pm.test('Estado CONFIRMED', () => pm.expect(json.status).to.eql('CONFIRMED'));
      pm.test('Total = 2 x 49.90', () => pm.expect(Number(json.totalAmount)).to.eql(99.8));
    language: text/javascript
order: 1000
