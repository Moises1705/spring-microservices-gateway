$kind: http-request
url: "{{gatewayUrl}}/api/v1/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Es el producto creado', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('productId')));
    language: text/javascript
order: 3000
