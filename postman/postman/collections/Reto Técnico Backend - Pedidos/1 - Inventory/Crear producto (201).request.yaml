$kind: http-request
url: "{{gatewayUrl}}/api/v1/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sku": "SKU-{{$timestamp}}",
      "name": "Producto Postman",
      "stockAvailable": 100,
      "price": 49.90
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set('productId', json.id);
      pm.test('Stock inicial 100', () => pm.expect(json.stockAvailable).to.eql(100));
    language: text/javascript
order: 1000
