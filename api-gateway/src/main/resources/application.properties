spring.application.name=api-gateway
server.port=8080
inventory-service.base-url=${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}
order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8180/realms/reto-realm}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Inventory Service
springdoc.swagger-ui.urls[0].url=/docs/inventory/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/docs/order/v3/api-docs