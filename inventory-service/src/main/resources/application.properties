spring.application.name=inventory-service
server.port=8082
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/inventory_db}
spring.datasource.username=${DB_USER:inventory_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8180/realms/reto-realm}
springdoc.paths-to-match=/api/**