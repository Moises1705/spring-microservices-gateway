spring.application.name=order-service
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/order_db}
spring.datasource.username=${DB_USER:order_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
inventory-service.base-url=${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8180/realms/reto-realm}
springdoc.paths-to-match=/api/**